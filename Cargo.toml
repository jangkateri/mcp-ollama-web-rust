[package]
name = "mcp-ollama-web-rust"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "MCP stdio server exposing Ollama-backed web_search and web_fetch tools"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jangkateri/mcp-ollama-web-rust"
homepage = "https://github.com/jangkateri/mcp-ollama-web-rust"
documentation = "https://github.com/jangkateri/mcp-ollama-web-rust#readme"
keywords = ["mcp", "ollama", "web-search", "web-fetch", "stdio"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "mcp-ollama-web-rust"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
